# Feature List
features                                  :

  - title                                 : Play Against the iPhone
    description                           : Four levels, from Easy to Unbeatable. The iPhone varies its moves, so no two games are alike.
    fontawesome_icon_name                 : robot

  - title                                 : Two Players, One Phone
    description                           : Pass the phone and play face to face. Tap anywhere in a column to drop your token.
    fontawesome_icon_name                 : user-friends

  - title                                 : Online With Friends
    description                           : Invite a friend through Game Center and play from anywhere.
    fontawesome_icon_name                 : globe

  - title                                 : Three Styles
    description                           : Toon, Pixel or Comic. Change the look of the whole game in the settings, in light or dark mode.
    fontawesome_icon_name                 : palette

  - title                                 : Stats and Leaderboards
    description                           : Your wins, losses and draws by level, Game Center leaderboards and achievements.
    fontawesome_icon_name                 : trophy

  - title                                 : Ads Never in Your Way
    description                           : No ad during a game or over the board. Remove them all with a single purchase.
    fontawesome_icon_name                 : ban



